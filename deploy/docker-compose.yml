# ============================================================================
# mem_reg 生产级登录注册系统 · Docker Compose（docs/05 §2 服务清单）
# 用法：cp .env.example .env && docker compose up -d
# 核心服务：docker compose up -d mysql redis backend frontend
# 完整（含日志栈）：docker compose --profile full up -d
# ============================================================================

name: mem-reg

services:
  mysql:
    image: mysql:8.0
    container_name: mem-reg-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mem_reg}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower_case_table_names=1
      - --binlog_format=ROW
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password_dev}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mem-reg-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mem-reg-backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-true}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mem_reg}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填}
      JWT_TICKET_SECRET: ${JWT_TICKET_SECRET:?JWT_TICKET_SECRET 必填}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY 必填}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMS_MOCK: ${SMS_MOCK:-true}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      KYC_PROVIDER_SECRET: ${KYC_PROVIDER_SECRET:-mock-secret}
      OAUTH_REDIRECT_WHITELIST: ${OAUTH_REDIRECT_WHITELIST:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AUTH_EXCEPT_PATHS: ${AUTH_EXCEPT_PATHS:-/api/v1/kyc/callback/,/api/v1/2fa/login/verify,/api/v1/2fa/recovery/verify}
      LOGIN_DEFAULT_COUNTRY_CODE: ${LOGIN_DEFAULT_COUNTRY_CODE:-+86}
      # 限流阈值（docs/04 §4.1；dev 放宽便于演示/测试，生产收紧）
      RATE_IP_REGISTER: ${RATE_IP_REGISTER:-100}
      RATE_IP_DEFAULT: ${RATE_IP_DEFAULT:-200}
      RATE_IP_REFRESH: ${RATE_IP_REFRESH:-200}
      RATE_SMS_PER_HOUR: ${RATE_SMS_PER_HOUR:-300}
    ports:
      - "${BACKEND_PORT:-9501}:9501"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-runtime:/opt/www/runtime
      # 上传文件持久化（头像等，docs/02 §8.2b）
      - ../backend/public/uploads:/opt/www/public/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mem-reg-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ../deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # dev 短信通道 mock（docs/05 §2）：回显验证码，仅 dev 启用
  sms-mock:
    build:
      context: ../deploy/sms-mock
    container_name: mem-reg-sms-mock
    ports:
      - "9502:9502"
    profiles: ["full"]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: mem-reg-promtail
    volumes:
      - ../deploy/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    profiles: ["full"]
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: mem-reg-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    profiles: ["full"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mem-reg-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    profiles: ["full"]
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-runtime:
