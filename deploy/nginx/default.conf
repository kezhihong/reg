# 前端 nginx 配置（docs/05 §2.2 / docs/04 §6.1 安全头）
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 安全响应头（docs/04 §6.1）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 静态资源（指纹缓存）
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API 反向代理（docs/01 §2.1 同源部署）
    # 注意：不得使用 proxy_cookie_path 改写 Cookie 属性——后端 Set-Cookie 已带
    # 正确的 Path(/api、/api/v1/auth/refresh)/HttpOnly/SameSite（docs/04 §3.1），
    # 改写会破坏 Path 导致 Cookie 无法按路径发送（CSRF 419）。
    location /api/ {
        proxy_pass http://backend:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Cookie $http_cookie;
    }

    # 上传文件静态服务（头像等，后端固定目录 public/uploads，docs/02 §8.2b）
    location /uploads/ {
        proxy_pass http://backend:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
